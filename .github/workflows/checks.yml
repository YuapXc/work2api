name: Checks and commit binaries

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # New pushes must not cancel an earlier commit's deployable build.
  group: checks-${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  package:
    name: Package ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [build, frontend, format]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, extension: "", archive: tar.gz }
          - { goos: linux, goarch: arm64, extension: "", archive: tar.gz }
          - { goos: windows, goarch: amd64, extension: .exe, archive: zip }
          - { goos: windows, goarch: arm64, extension: .exe, archive: zip }
          - { goos: darwin, goarch: amd64, extension: "", archive: tar.gz }
          - { goos: darwin, goarch: arm64, extension: "", archive: tar.gz }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and package commit
        id: package
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXTENSION: ${{ matrix.extension }}
          ARCHIVE_FORMAT: ${{ matrix.archive }}
        run: |
          commit="$(git rev-parse HEAD)"
          version="dev-${commit:0:12}"
          package_name="work2api_${version}_${GOOS}_${GOARCH}"
          mkdir -p "dist/$package_name"
          go build -trimpath -ldflags="-s -w -X main.version=$version -X main.releaseBuild=false -X main.releaseRepository=${GITHUB_REPOSITORY} -X main.releaseCommit=$commit" \
            -o "dist/$package_name/work2api$EXTENSION" ./cmd/server
          cp README.md .env.example "dist/$package_name/"
          printf '{"version":"%s","commit":"%s","os":"%s","arch":"%s","release":false}\n' \
            "$version" "$commit" "$GOOS" "$GOARCH" > "dist/$package_name/build-info.json"
          if [[ "$ARCHIVE_FORMAT" == "zip" ]]; then
            (cd dist && zip -q -r "$package_name.zip" "$package_name")
          else
            tar -C dist -czf "dist/$package_name.tar.gz" "$package_name"
          fi
          archive="$package_name.$ARCHIVE_FORMAT"
          (cd dist && sha256sum "$archive" > "$archive.sha256")
          echo "package_name=$package_name" >> "$GITHUB_OUTPUT"
          echo "### $package_name" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $commit. Temporary build; download the archive and SHA-256 from this run's Artifacts." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload commit binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.package_name }}
          path: |
            dist/${{ steps.package.outputs.package_name }}.${{ matrix.archive }}
            dist/${{ steps.package.outputs.package_name }}.${{ matrix.archive }}.sha256
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  build:
    name: Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check gateway package boundaries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          go list -f '{{ $pkg := .ImportPath }}{{ range .Deps }}{{ $pkg }} {{ . }}{{ "\n" }}{{ end }}' \
            ./internal/core/... ./internal/requestdiag ./internal/streamwatch ./internal/tokenusage \
            ./internal/workbuddy/... ./internal/qoder/... ./internal/opencode/... ./internal/trae/... |
          awk '
            {
              split($1, source, "/")
              split($2, dependency, "/")
              if (dependency[1] == "work2api" && dependency[2] == "internal" &&
                  dependency[3] ~ /^(workbuddy|qoder|opencode|trae)$/ && source[3] != dependency[3]) {
                print "Cross-channel dependency: " $0 > "/dev/stderr"
                failed = 1
              }
            }
            END { exit failed }
          '
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -trimpath ./...
      - name: Test
        run: go test ./...

  frontend:
    name: Frontend and embedded assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - working-directory: webui
        run: |
          npm ci
          npm run build
          npm run check:embed

  format:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check Go formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "以下文件未通过 gofmt：" >&2
            printf '%s\n' "$unformatted" >&2
            exit 1
          fi
